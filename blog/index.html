<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Wobblebomb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff;
            color: #111;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 17px;
            line-height: 1.6;
        }

        a {
            color: #00d;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Layout */
        #wrapper {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        #header {
            border-bottom: 1px solid #ddd;
            padding: 28px 0 18px;
            margin-bottom: 40px;
        }

        #header h1 {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        #header h1 a {
            color: #111;
            text-decoration: none;
        }

        #header h1 span.site {
            color: #999;
            font-weight: 400;
        }

        #header nav {
            margin-top: 8px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 12px;
        }

        #header nav a {
            color: #FF49EA;
            margin-right: 16px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        #header nav a:hover {
            color: #00d9ff;
            text-decoration: none;
        }

        /* Posts */
        .post {
            margin-bottom: 56px;
            padding-bottom: 56px;
            border-bottom: 1px solid #eee;
        }

        .post:last-of-type {
            border-bottom: none;
        }

        .post .date {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .post h2 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.3px;
            margin-bottom: 18px;
        }

        .post h2 a {
            color: #111;
            text-decoration: none;
        }

        .post h2 a:hover {
            color: #00d;
        }

        .post .byline {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 12px;
            color: #999;
            margin-bottom: 22px;
            font-style: italic;
        }

        .post .body p {
            margin-bottom: 18px;
        }

        .post .body ul {
            margin: 0 0 18px 24px;
        }

        .post .body ul li {
            margin-bottom: 6px;
        }

        .post .body blockquote {
            border-left: 3px solid #ddd;
            margin: 0 0 18px 0;
            padding: 2px 0 2px 18px;
            color: #555;
            font-style: italic;
        }

        .post .body strong {
            font-weight: 700;
        }

        /* Footer */
        #footer {
            margin: 60px 0 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 12px;
            color: #999;
        }

        #footer a {
            color: #999;
        }
    </style>
</head>
<body>
<div id="wrapper">

    <div id="header">
        <h1><a href="/blog/">Blog <span class="site">— <a href="/" style="color:#999;font-weight:400;">wobblebomb.com</a></span></a></h1>
        <nav>
            <a href="/">Home</a>
            <a href="/blog/">Blog</a>
            <a href="/cauc-talk.html">Cauc Talk</a>
            <a href="/thebens.html">The Bens</a>
            <a href="/simcityshow/">Simcity Show</a>
            <a href="/conor/">Conor</a>
        </nav>
    </div>

    <div class="post">
        <div class="date">Thursday, 26 February 2026</div>
        <h2><a href="#">Hello World</a></h2>
        <div class="body">
            <p>Hello world.</p>
        </div>
    </div>

    <div id="footer">
        <a href="/">wobblebomb.com</a>
    </div>

</div>
</body>
</html>
