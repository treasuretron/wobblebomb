<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conor McArdle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f0;
            color: #111;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        header {
            padding: 32px 48px;
            border-bottom: 3px solid #111;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        header .name {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        header a {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #111;
            text-decoration: none;
            opacity: 0.4;
        }

        header a:hover {
            opacity: 1;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 48px;
        }

        .quote-block {
            max-width: 820px;
            width: 100%;
        }

        .rule-top {
            width: 48px;
            height: 4px;
            background-color: #e5000a;
            margin-bottom: 48px;
        }

        blockquote {
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: #111;
            margin-bottom: 40px;
        }

        blockquote::before {
            content: '\201C';
            color: #e5000a;
        }

        blockquote::after {
            content: '\201D';
            color: #e5000a;
        }

        cite {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-style: normal;
            color: #111;
            opacity: 0.45;
        }

        footer {
            padding: 32px 48px;
            border-top: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer span {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <header>
        <span class="name">Conor McArdle</span>
        <a href="/">wobblebomb.com</a>
    </header>

    <main>
        <div class="quote-block">
            <div class="rule-top"></div>
            <blockquote>Vibe Coding absolutely can be sexy!</blockquote>
            <cite>Conor McArdle</cite>
        </div>
    </main>

    <footer>
        <span>wobblebomb</span>
        <span>2026</span>
    </footer>

</body>
</html>
